<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Grocery Inventory — Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-6 col-lg-4">

            <div class="text-center mb-4">
                <i class="bi bi-basket2-fill text-success" style="font-size:3rem;"></i>
                <h2 class="fw-bold mt-2">Grocery Inventory</h2>
                <p class="text-muted">Sign in to continue</p>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <div th:if="${param.error}" class="alert alert-danger py-2">
                        <i class="bi bi-exclamation-circle me-1"></i> Invalid username or password.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success py-2">
                        <i class="bi bi-check-circle me-1"></i> You have been logged out.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                        </button>
                    </form>
                </div>
            </div>

            <div class="card mt-3 border-0 bg-white shadow-sm">
                <div class="card-body py-2 px-4">
                    <small class="text-muted">
                        <strong>Employee:</strong> admin / admin123 &nbsp;|&nbsp;
                        <strong>Customer:</strong> customer / customer123
                    </small>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
