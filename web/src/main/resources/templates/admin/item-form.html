<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isNew} ? 'Add Item' : 'Edit Item'">Item Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-success px-4">
    <span class="navbar-brand fw-bold"><i class="bi bi-basket2-fill me-2"></i>Grocery Inventory</span>
    <div class="d-flex align-items-center gap-3">
        <span class="text-white"><i class="bi bi-person-badge me-1"></i>Employee Panel</span>
        <a th:href="@{/logout}" class="btn btn-light btn-sm">
            <i class="bi bi-box-arrow-right me-1"></i>Logout
        </a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="d-flex align-items-center mb-4 gap-2">
                <a th:href="@{/admin/inventory}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h4 class="mb-0 fw-bold" th:text="${isNew} ? 'Add New Item' : 'Edit Item'">Item Form</h4>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form th:action="${isNew} ? @{/admin/item/save} : @{'/admin/item/' + ${item.id} + '/update'}"
                          th:object="${item}"
                          method="post">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Description <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{description}" class="form-control" placeholder="e.g. Whole Milk 1L" required>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label class="form-label fw-semibold">Item Number <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{itemNumber}" class="form-control" placeholder="e.g. ITM001" required>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{category}" class="form-control" placeholder="e.g. Dairy" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label class="form-label fw-semibold">Temperature (°C)</label>
                                <input type="number" th:field="*{temperature}" class="form-control" placeholder="e.g. 4" step="0.1">
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label fw-semibold">Location</label>
                                <input type="text" th:field="*{location}" class="form-control" placeholder="e.g. Aisle 1">
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-sm-6">
                                <label class="form-label fw-semibold">Quantity <span class="text-danger">*</span></label>
                                <input type="number" th:field="*{quantity}" class="form-control" placeholder="e.g. 50" min="0" required>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label fw-semibold">Price ($) <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" th:field="*{price}" class="form-control" placeholder="0.00" min="0" step="0.01" required>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success px-4">
                                <i class="bi bi-floppy me-1"></i>
                                <span th:text="${isNew} ? 'Add Item' : 'Save Changes'">Save</span>
                            </button>
                            <a th:href="@{/admin/inventory}" class="btn btn-outline-secondary px-4">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
