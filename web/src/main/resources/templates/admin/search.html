<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search Items — Employee</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success px-4">
    <span class="navbar-brand fw-bold"><i class="bi bi-basket2-fill me-2"></i>Grocery Inventory</span>
    <div class="d-flex align-items-center gap-3">
        <span class="text-white"><i class="bi bi-person-badge me-1"></i>Employee Panel</span>
        <a th:href="@{/admin/inventory}" class="btn btn-outline-light btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Inventory
        </a>
        <a th:href="@{/logout}" class="btn btn-light btn-sm">
            <i class="bi bi-box-arrow-right me-1"></i>Logout
        </a>
    </div>
</nav>

<div class="container py-5">
    <h4 class="fw-bold mb-4"><i class="bi bi-search me-2 text-success"></i>Search Items</h4>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
            <form th:action="@{/admin/search}" method="get">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Search By</label>
                    <div class="d-flex gap-4">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="type" value="name"
                                   th:checked="${searchType == null or searchType == 'name'}">
                            <label class="form-check-label">Name</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="type" value="category"
                                   th:checked="${searchType == 'category'}">
                            <label class="form-check-label">Category</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="type" value="price"
                                   th:checked="${searchType == 'price'}">
                            <label class="form-check-label">Max Price ($)</label>
                        </div>
                    </div>
                </div>
                <div class="input-group">
                    <input type="text" name="query" class="form-control form-control-lg"
                           th:value="${searchQuery}" placeholder="Enter search term..." autofocus>
                    <button type="submit" class="btn btn-success px-4">
                        <i class="bi bi-search me-1"></i>Search
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Results -->
    <div th:if="${results != null}">
        <div th:if="${#lists.isEmpty(results)}" class="alert alert-info">
            <i class="bi bi-info-circle me-1"></i> No items found for "<span th:text="${searchQuery}"></span>".
        </div>

        <div th:if="${!#lists.isEmpty(results)}" class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3">
                <span class="fw-semibold">
                    <span th:text="${#lists.size(results)}"></span> result(s) for "<span th:text="${searchQuery}"></span>"
                </span>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Description</th>
                            <th>Item No.</th>
                            <th>Category</th>
                            <th>Temp (°C)</th>
                            <th>Location</th>
                            <th>Qty</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${results}" th:classappend="${item.quantity < 5} ? 'table-warning' : ''">
                            <td class="fw-semibold" th:text="${item.description}"></td>
                            <td><span class="badge bg-secondary" th:text="${item.itemNumber}"></span></td>
                            <td><span class="badge bg-success-subtle text-success border border-success-subtle" th:text="${item.category}"></span></td>
                            <td th:text="${item.temperature} + '°C'"></td>
                            <td th:text="${item.location}"></td>
                            <td>
                                <span th:if="${item.quantity < 5}" class="badge bg-danger" th:text="${item.quantity}"></span>
                                <span th:if="${item.quantity >= 5}" th:text="${item.quantity}"></span>
                            </td>
                            <td th:text="'$' + ${#numbers.formatDecimal(item.price, 1, 2)}"></td>
                            <td>
                                <a th:href="@{'/admin/item/' + ${item.id} + '/edit'}" class="btn btn-outline-primary btn-sm">
                                    <i class="bi bi-pencil"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
