<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Your Cart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success px-4">
    <span class="navbar-brand fw-bold"><i class="bi bi-basket2-fill me-2"></i>Grocery Inventory</span>
    <div class="d-flex align-items-center gap-3">
        <span class="text-white"><i class="bi bi-person me-1"></i>Customer</span>
        <a th:href="@{/cart/browse}" class="btn btn-outline-light btn-sm">
            <i class="bi bi-shop me-1"></i>Browse
        </a>
        <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">
            <i class="bi bi-box-arrow-right me-1"></i>Logout
        </a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <h4 class="fw-bold mb-4"><i class="bi bi-cart3 me-2 text-success"></i>Your Cart</h4>

            <div th:if="${#lists.isEmpty(cart)}" class="card border-0 shadow-sm text-center py-5">
                <div class="card-body">
                    <i class="bi bi-cart-x text-muted" style="font-size:4rem;"></i>
                    <h5 class="mt-3 text-muted">Your cart is empty</h5>
                    <a th:href="@{/cart/browse}" class="btn btn-success mt-3">
                        <i class="bi bi-shop me-1"></i>Start Shopping
                    </a>
                </div>
            </div>

            <div th:if="${!#lists.isEmpty(cart)}">
                <div class="card border-0 shadow-sm mb-3">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Item</th>
                                    <th class="text-end">Price</th>
                                    <th class="text-center">Qty</th>
                                    <th class="text-end">Subtotal</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item, s : ${cart}">
                                    <td class="fw-semibold" th:text="${item.description}"></td>
                                    <td class="text-end" th:text="'$' + ${#numbers.formatDecimal(item.price, 1, 2)}"></td>
                                    <td class="text-center">
                                        <span class="badge bg-light text-dark border" th:text="${item.quantity}"></span>
                                    </td>
                                    <td class="text-end fw-semibold text-success"
                                        th:text="'$' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}"></td>
                                    <td class="text-center">
                                        <form th:action="@{'/cart/remove/' + ${s.index}}" method="post">
                                            <button type="submit" class="btn btn-outline-danger btn-sm">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                            <tfoot class="table-light">
                                <tr>
                                    <td colspan="3" class="fw-bold text-end fs-5">Total</td>
                                    <td class="fw-bold text-success fs-5 text-end">$<span th:text="${total}">0.00</span></td>
                                    <td></td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <div class="d-flex gap-2">
                        <a th:href="@{/cart/browse}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i>Continue Shopping
                        </a>
                        <form th:action="@{/cart/clear}" method="post">
                            <button type="submit" class="btn btn-outline-danger"
                                    onclick="return confirm('Clear your cart?')">
                                <i class="bi bi-x-circle me-1"></i>Clear Cart
                            </button>
                        </form>
                    </div>
                    <form th:action="@{/cart/checkout}" method="post">
                        <button type="submit" class="btn btn-success px-5 py-2 fw-semibold">
                            <i class="bi bi-bag-check me-1"></i>Finish &amp; Pay
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
