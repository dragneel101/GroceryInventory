<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Browse Items</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success px-4">
    <span class="navbar-brand fw-bold"><i class="bi bi-basket2-fill me-2"></i>Grocery Inventory</span>
    <div class="d-flex align-items-center gap-3">
        <span class="text-white"><i class="bi bi-person me-1"></i>Customer</span>
        <a th:href="@{/cart/search}" class="btn btn-outline-light btn-sm">
            <i class="bi bi-search me-1"></i>Search
        </a>
        <a th:href="@{/cart/view}" class="btn btn-light btn-sm position-relative">
            <i class="bi bi-cart3 me-1"></i>Cart
            <span th:if="${cartCount > 0}"
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                  th:text="${cartCount}"></span>
        </a>
        <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">
            <i class="bi bi-box-arrow-right me-1"></i>Logout
        </a>
    </div>
</nav>

<div class="container-fluid py-4 px-4">

    <!-- Flash message -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-1"></i>
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0"><i class="bi bi-shop me-2 text-success"></i>All Items</h4>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Location</th>
                        <th>Price</th>
                        <th>In Stock</th>
                        <th class="text-center">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(items)}">
                        <td colspan="6" class="text-center text-muted py-4">No items available.</td>
                    </tr>
                    <tr th:each="item : ${items}">
                        <td class="fw-semibold" th:text="${item.description}"></td>
                        <td><span class="badge bg-success-subtle text-success border border-success-subtle" th:text="${item.category}"></span></td>
                        <td th:text="${item.location}"></td>
                        <td class="fw-semibold text-success" th:text="'$' + ${#numbers.formatDecimal(item.price, 1, 2)}"></td>
                        <td>
                            <span th:if="${item.quantity == 0}" class="badge bg-danger">Out of Stock</span>
                            <span th:if="${item.quantity > 0 and item.quantity < 5}" class="badge bg-warning text-dark" th:text="${item.quantity} + ' left'"></span>
                            <span th:if="${item.quantity >= 5}" class="badge bg-success-subtle text-success border border-success-subtle" th:text="${item.quantity}"></span>
                        </td>
                        <td class="text-center">
                            <form th:action="@{'/cart/add/' + ${item.id}}" method="post">
                                <input type="hidden" name="from" value="browse">
                                <button type="submit" class="btn btn-success btn-sm"
                                        th:disabled="${item.quantity == 0}">
                                    <i class="bi bi-cart-plus me-1"></i>Add to Cart
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
