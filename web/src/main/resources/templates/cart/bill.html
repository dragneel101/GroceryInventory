<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Receipt</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-7 col-lg-5">

            <div class="card border-0 shadow receipt-card">
                <!-- Store header -->
                <div class="card-header bg-success text-white text-center py-4">
                    <i class="bi bi-basket2-fill fs-2"></i>
                    <h4 class="fw-bold mb-0 mt-1">Grocery Inventory</h4>
                    <small class="opacity-75">Thank you for shopping with us!</small>
                </div>

                <div class="card-body p-4">
                    <!-- Transaction info -->
                    <div class="d-flex justify-content-between text-muted small mb-3">
                        <span>Receipt #<span th:text="${transaction.id}"></span></span>
                        <span th:text="${#temporals.format(transaction.transactionDate, 'MMM dd, yyyy HH:mm')}"></span>
                    </div>
                    <div class="text-muted small mb-3">
                        Customer: <strong th:text="${transaction.customerUsername}"></strong>
                    </div>

                    <hr>

                    <!-- Items -->
                    <div class="mb-3">
                        <div th:each="item : ${transaction.items}"
                             class="d-flex justify-content-between align-items-center py-1">
                            <div>
                                <span th:text="${item.description}" class="fw-semibold"></span>
                                <span class="text-muted small ms-2">x<span th:text="${item.quantity}"></span></span>
                            </div>
                            <span th:text="'$' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}"></span>
                        </div>
                    </div>

                    <hr>

                    <!-- Total -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <span class="fw-bold fs-5">TOTAL</span>
                        <span class="fw-bold fs-5 text-success">$<span th:text="${total}">0.00</span></span>
                    </div>

                    <!-- Paid stamp -->
                    <div class="text-center mb-4">
                        <span class="badge bg-success px-4 py-2 fs-6">
                            <i class="bi bi-check-circle me-1"></i>PAID
                        </span>
                    </div>

                    <a th:href="@{/cart/browse}" class="btn btn-success w-100 py-2 fw-semibold">
                        <i class="bi bi-shop me-1"></i>Continue Shopping
                    </a>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
