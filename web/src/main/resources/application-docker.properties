# Docker / Coolify environment — values injected via environment variables
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:grocery_db}
spring.datasource.username=${DB_USER:grocery}
spring.datasource.password=${DB_PASS:grocery123}

spring.jpa.hibernate.ddl-auto=update
spring.thymeleaf.cache=true

# Seed credentials (injected via Coolify environment variables)
seed.admin.username=${SEED_ADMIN_USERNAME}
seed.admin.password=${SEED_ADMIN_PASSWORD}
seed.customer.username=${SEED_CUSTOMER_USERNAME}
seed.customer.password=${SEED_CUSTOMER_PASSWORD}
